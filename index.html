<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おすすめキャスト診断</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f6;color:#181818;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif}.wrap{max-width:640px;margin:auto;padding:24px 14px}header{text-align:center;margin:15px 0 24px}h1{font-size:28px;margin:0 0 8px}p{color:#666;line-height:1.7}.panel{background:white;border:1px solid #e8e8e8;border-radius:22px;padding:25px 18px;box-shadow:0 8px 28px #00000008;text-align:center}.hidden{display:none!important}.options{display:grid;gap:12px;margin:25px 0}.option,button{font:inherit;cursor:pointer;border-radius:13px}.option{background:#fff;border:2px solid #e5e5e5;padding:17px 12px;font-weight:700}.option:hover,.option:focus{border-color:#111;background:#fafafa}button.primary{border:0;background:#181818;color:white;padding:14px 26px;font-weight:700}.progress{height:7px;background:#eee;border-radius:9px;overflow:hidden;margin:16px 0 25px}.progress>div{height:100%;background:#111;transition:width .2s}.count{color:#777;font-size:14px}.photo{width:100%;max-width:400px;border-radius:18px;display:block;margin:20px auto}.name{font-size:38px;font-weight:900;margin:12px 0}.back{border:0;background:none;color:#666;text-decoration:underline;padding:10px}.note{font-size:12px;color:#999;margin-top:20px}</style></head><body><div class="wrap"><header><h1>おすすめキャスト診断</h1><p>いくつかの質問に答えて、あなたにぴったりのキャストを見つけよう！</p></header><section id="intro" class="panel"><h2>あなたにおすすめなのは誰？</h2><p>全5問・約1分で診断できます。</p><button class="primary" id="start">診断を始める</button></section><section id="quiz" class="panel hidden"><div id="count" class="count"></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div id="options" class="options"></div><button id="back" class="back">ひとつ前に戻る</button></section><section id="result" class="panel hidden"><h2>あなたにおすすめのキャストは…</h2><div class="name">める</div><img class="photo" src="める.PNG" alt="おすすめキャスト める"><p>あなたにおすすめなのは「める」さん！<br>ぜひ会いに行ってみてください♡</p><button class="primary" id="again">もう一度診断する</button></section></div><script>const QUESTIONS=[{q:'キャストと過ごすなら、どんな時間が好き？',a:['楽しくワイワイ盛り上がりたい','ゆっくり落ち着いて話したい','たくさん笑わせてほしい','優しく癒やされたい']},{q:'初対面のキャストに求めるのは？',a:['明るく話しかけてくれる','聞き上手で落ち着いている','自然体で親しみやすい','ちょっとミステリアス']},{q:'好きな雰囲気は？',a:['かわいい系','きれい系','元気系','大人っぽい系']},{q:'会話で盛り上がりたい話題は？',a:['趣味や好きなもの','日常の出来事','恋愛トーク','何でも気軽に話したい']},{q:'キャストに一番期待することは？',a:['楽しい時間','癒やし','ドキドキ感','気軽に話せる安心感']}];let answers=[],index=0;const $=id=>document.getElementById(id);function show(id){['intro','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function render(){if(index>=QUESTIONS.length){show('result');return}show('quiz');$('count').textContent=`質問 ${index+1} / ${QUESTIONS.length}`;$('bar').style.width=`${index/QUESTIONS.length*100}%`;$('question').textContent=QUESTIONS[index].q;$('options').innerHTML='';QUESTIONS[index].a.forEach((s,i)=>{const b=document.createElement('button');b.className='option';b.textContent=s;b.onclick=()=>{answers[index]=i;index++;render()};$('options').appendChild(b)});$('back').style.visibility=index?'visible':'hidden'}$('start').onclick=()=>{answers=[];index=0;render()};$('again').onclick=()=>{answers=[];index=0;render()};$('back').onclick=()=>{if(index){index--;render()}};</script></body></html>
